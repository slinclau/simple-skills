name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  skills:
    name: Frontmatter & sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skills
        run: python3 scripts/validate-skills.py

  links:
    name: Dead links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --exclude-loopback
            --exclude-mail
            --max-retries 3
            --timeout 20
            "**/*.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
